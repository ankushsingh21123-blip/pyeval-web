<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pyeval web</title>
<style>body{font:15px system-ui;max-width:760px;margin:2rem auto;padding:0 1rem}table{border-collapse:collapse;width:100%}td,th{border:1px solid #ccc;padding:4px 8px;text-align:left}button{margin-left:6px}textarea{width:100%;height:110px;font-family:monospace}.bad{color:#b00}.ok{color:#070}</style></head>
<body>
<h1>pyeval web</h1>
<p>Runs fixed, pre-written candidate answers against test cases and stores results in Postgres. Code you paste below is only parsed (static lint), never executed.</p>
<h2>Fixtures</h2><div id="tasks">loading...</div>
<h2>Lint a snippet (no execution)</h2>
<textarea id="code">def rev(s):
    try:
        return s[::-1]
    except:
        return ''</textarea><br><button id="lint">Lint</button> <span id="lintout"></span>
<h2>Recent runs</h2><table id="runs"><thead><tr><th>#</th><th>task</th><th>answer</th><th>passed</th><th>failure modes</th><th>flags</th></tr></thead><tbody></tbody></table>
<script>
async function api(p,o){const r=await fetch(p,o);return r.json()}
async function load(){
 const tasks=await api('/api/tasks');
 document.getElementById('tasks').innerHTML=tasks.map(t=>'<h3>'+t.title+'</h3>'+t.answers.map(a=>'<div>'+a.label+'<button data-a="'+a.id+'">Run tests</button></div>').join('')).join('');
 document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{await api('/api/runs',{method:'POST',body:JSON.stringify({answer_id:+b.dataset.a})});runs()});
 runs()}
async function runs(){
 const rs=await api('/api/runs');
 document.querySelector('#runs tbody').innerHTML=rs.map(r=>'<tr><td>'+r.id+'</td><td>'+r.task_id+'</td><td>'+r.label+'</td><td class="'+(r.passed==r.total?'ok':'bad')+'">'+r.passed+'/'+r.total+'</td><td>'+r.failure_modes.join(', ')+'</td><td>'+r.quality_flags.join(', ')+'</td></tr>').join('')}
document.getElementById('lint').onclick=async()=>{
 const o=await api('/api/lint',{method:'POST',body:JSON.stringify({code:document.getElementById('code').value})});
 document.getElementById('lintout').textContent=(o.parses?'parses':'does not parse')+'; flags: '+(o.flags.join(', ')||'none')}
load();
</script></body></html>
