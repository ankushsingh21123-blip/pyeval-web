<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>pyeval web</title>
<style>
*{box-sizing:border-box}body{font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;max-width:820px;margin:0 auto;padding:20px 14px;background:#f6f7f9;color:#1b1f24}
h1{margin:0 0 4px}h2{margin:28px 0 8px;font-size:1.1rem}h3{margin:12px 0 6px;font-size:1rem}
.card{background:#fff;border:1px solid #dde1e6;border-radius:10px;padding:14px 16px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-top:1px solid #eef0f2}.row:first-of-type{border-top:0}
button{background:#1f6feb;color:#fff;border:0;border-radius:6px;padding:7px 12px;font:inherit;cursor:pointer}button:hover{background:#1858bd}
textarea{width:100%;height:130px;font:13px ui-monospace,Menlo,monospace;border:1px solid #c8cdd3;border-radius:6px;padding:8px}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;min-width:520px;background:#fff}td,th{border-bottom:1px solid #e6e9ec;padding:7px 8px;text-align:left;font-size:14px}th{background:#f0f2f5}
.bad{color:#b42318;font-weight:600}.ok{color:#067647;font-weight:600}.note{color:#555}#lintout{margin-left:8px}
</style></head>
<body>
<h1>pyeval web</h1>
<p class="note">Runs fixed, pre-written candidate answers against test cases and stores results in Postgres. Code you paste below is only parsed (static lint), never executed.</p>
<h2>Fixtures</h2><div id="tasks" class="card">loading...</div>
<h2>Lint a snippet (no execution)</h2>
<textarea id="code">def rev(s):
    try:
        return s[::-1]
    except:
        return ''</textarea><br><button id="lint">Lint</button> <span id="lintout"></span>
<h2>Recent runs</h2><div class="tw card"><table id="runs"><thead><tr><th>#</th><th>task</th><th>answer</th><th>passed</th><th>failure modes</th><th>flags</th></tr></thead><tbody></tbody></table></div>
<script>
async function api(p,o){const r=await fetch(p,o);return r.json()}
async function load(){
 const tasks=await api('/api/tasks');
 document.getElementById('tasks').innerHTML=tasks.map(t=>'<h3>'+t.title+'</h3>'+t.answers.map(a=>'<div class="row"><span>'+a.label+'</span><button data-a="'+a.id+'">Run tests</button></div>').join('')).join('');
 document.querySelectorAll('button[data-a]').forEach(b=>b.onclick=async()=>{await api('/api/runs',{method:'POST',body:JSON.stringify({answer_id:+b.dataset.a})});runs()});
 runs()}
async function runs(){
 const rs=await api('/api/runs');
 document.querySelector('#runs tbody').innerHTML=rs.map(r=>'<tr><td>'+r.id+'</td><td>'+r.task_id+'</td><td>'+r.label+'</td><td class="'+(r.passed==r.total?'ok':'bad')+'">'+r.passed+'/'+r.total+'</td><td>'+r.failure_modes.join(', ')+'</td><td>'+r.quality_flags.join(', ')+'</td></tr>').join('')}
document.getElementById('lint').onclick=async()=>{
 const o=await api('/api/lint',{method:'POST',body:JSON.stringify({code:document.getElementById('code').value})});
 document.getElementById('lintout').textContent=(o.parses?'parses':'does not parse')+'; flags: '+(o.flags.join(', ')||'none')}
load();
</script></body></html>
